name: arcade-vibe

services:
  postgres:
    image: postgres
    container_name: arcade-vibe-postgres
    environment:
      POSTGRES_DB: arcade-vibe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - arcade-vibe_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  arcade-vibe_postgres_data:
